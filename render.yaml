services:
  - type: web
    name: mark-mind-careers
    runtime: docker
    plan: free
    envVars:
      # DATABASE_URL disabled for now — using YAML file storage, no DB provisioned
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: mark-mind-db
      #     property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: APPLY_RATE_LIMIT_COUNT
        value: "3"
      - key: APPLY_RATE_LIMIT_WINDOW_SECONDS
        value: "3600"

# databases:
